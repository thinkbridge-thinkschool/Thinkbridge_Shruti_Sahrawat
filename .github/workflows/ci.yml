name: CI

on:
  push:
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  COVERAGE_THRESHOLD: '80'

jobs:
  # One leg per test project. fail-fast is off so a break in one suite still
  # lets the other two report - knowing that only the integration tests broke
  # is more useful than knowing that something broke.
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - OrderRefactor.Tests
          - Quotes.Tests.Unit
          - Quotes.Tests.Integration

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ matrix.project }}/${{ matrix.project }}.csproj

      - name: Build
        run: >
          dotnet build ${{ matrix.project }}/${{ matrix.project }}.csproj
          --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test ${{ matrix.project }}/${{ matrix.project }}.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory ${{ matrix.project }}/TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.project }}
          path: |
            ${{ matrix.project }}/TestResults/**/*.trx
            ${{ matrix.project }}/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  # Day 22 capstone. A separate job rather than a fourth matrix leg, and
  # deliberately without --collect:"XPlat Code Coverage", so it produces no
  # coverage-* artifact and cannot reach the gate below.
  #
  # Two reasons it stays out of the 80% union. The coverage <Include> filter in
  # coverlet.runsettings is an allowlist - [QuotesApi]*,[OrderRefactor]* - so a
  # capstone report would be empty anyway. And a kickoff scaffold is mostly
  # seams by design: counting its in-memory stubs against a threshold Day 4
  # worked hard to make honest would corrupt the number in the direction that
  # is hardest to notice, by making it easy to hit.
  #
  # What this job does gate is the thing that matters for a modular monolith:
  # Capstone.ArchitectureTests fails if any module references another module's
  # internals, so the boundaries are enforced on every push rather than in code
  # review.
  capstone:
    name: Capstone (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - capstone/tests/Capstone.Curation.Domain.Tests
          - capstone/tests/Capstone.ArchitectureTests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ matrix.project }}

      - name: Build
        run: dotnet build ${{ matrix.project }} --no-restore --configuration Release

      - name: Test
        run: dotnet test ${{ matrix.project }} --no-build --configuration Release

  # The gate runs once, on the union of all three reports. Gating each project
  # separately asks the unit suite to cover Program.cs, which it never executes -
  # a threshold no honest test can reach. See scripts/check-coverage.py.
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage from every test project
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts

      - name: Merge reports and enforce the threshold
        run: |
          set -euo pipefail
          mapfile -t reports < <(find coverage-artifacts -name 'coverage.cobertura.xml' | sort)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No coverage reports were downloaded"
            exit 1
          fi
          printf 'Found %d report(s):\n' "${#reports[@]}"
          printf '  %s\n' "${reports[@]}"
          echo
          python3 scripts/check-coverage.py "$COVERAGE_THRESHOLD" "${reports[@]}" \
            | tee coverage-summary.txt

      - name: Publish the summary on the run page
        if: always()
        run: |
          {
            echo '## Coverage'
            echo
            echo '```'
            cat coverage-summary.txt 2>/dev/null || echo 'No summary produced.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the merged summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.txt
          if-no-files-found: warn
