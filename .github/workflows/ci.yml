  quotes-tests-integration:
    name: Quotes.Tests.Integration
    runs-on: ubuntu-latest
    env:
      TEST_PROJECT: Quotes.Tests.Integration/Quotes.Tests.Integration.csproj
      COVERAGE_THRESHOLD: "70"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # GitHub-hosted ubuntu runners have Docker preinstalled, which Testcontainers needs.
      # First run pulls mcr.microsoft.com/mssql/server:2022-latest (~5 min).
      - run: dotnet restore "$TEST_PROJECT"
