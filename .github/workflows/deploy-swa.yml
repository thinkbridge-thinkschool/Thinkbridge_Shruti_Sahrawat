name: Deploy quotes-ui to Azure Static Web Apps

# Frontend-only deploy, separate from ci.yml's three .NET test legs — pushing
# a QuotesApi-only change shouldn't rebuild and redeploy the SPA, and vice
# versa. Scoped with `paths` so each workflow only wakes up for the half of
# the repo it actually cares about.
on:
  push:
    branches: [main]
    paths:
      - 'quotes-ui/**'
      - '.github/workflows/deploy-swa.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'quotes-ui/**'

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'quotes-ui'
          output_location: 'dist/quotes-ui/browser'
          skip_api_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request
    steps:
      - name: Close pull request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
