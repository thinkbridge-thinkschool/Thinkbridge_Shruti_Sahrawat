<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QuotesUi</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse, search, and add to a growing collection of quotes. A full-stack Angular and .NET quotes app built as part of the thinkschool program.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Two faces, two jobs: Source Serif 4 for quoted text (this is a quotes
       app — the words being quoted deserve a literary register), Inter for
       everything the UI itself says (labels, buttons, meta). Both variable
       fonts, loaded once.

       Loaded via the print-media swap trick rather than a plain <link
       rel="stylesheet">: a normal stylesheet link blocks first paint until
       it downloads, which is exactly what Lighthouse's render-blocking-insight
       audit flagged (~960ms). media="print" makes the browser fetch it at
       normal priority without blocking render (print stylesheets don't gate
       the screen render), then the onload swaps it to media="all" once it
       has actually arrived. The <noscript> fallback covers the vanishingly
       rare case of JS disabled, where onload never fires. display=swap in
       the URL means text still renders in a fallback font in the meantime
       instead of staying invisible, so nothing here trades one problem for
       a worse one (no flash-of-invisible-text). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
    />
  </noscript>
</head>
<body>
  <app-root></app-root>
</body>
</html>
