# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: repo-live
metadata:
    template: azd-init@1.31.1
services:
    quotes-api:
        project: QuotesApi
        host: containerapp
        language: dotnet
resources:
    quotes-api:
        type: host.containerapp
        port: 8080
        env:
            - name: ConnectionStrings__Default
              value: Server=tcp:sql-quotes2-qvdk5l.database.windows.net,1433;Database=quotesdb;Authentication=Active Directory Managed Identity;User Id=b5e81529-a6b9-4a13-ba5a-ce729ef9a3a3;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;
            - name: Database__Provider
              value: SqlServer
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
